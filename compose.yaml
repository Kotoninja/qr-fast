services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    restart: on-failure:3
    environment:
      - UV_LINK_MODE=copy
      - WATCHFILES_FORCE_POLLING=true
    command: uv run uvicorn main:app --host 0.0.0.0 --port 8000 --reload
  nginx:
    image: nginx:1.31.2-alpine@sha256:54f2a904c251d5a34adf545a72d32515a15e08418dae0266e23be2e18c66fefa
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./local.nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt/:/etc/letsencrypt/:ro
      - ./static:/static/
      - ./data:/data/
    environment:
      TZ: "Europe/Moscow"
    depends_on:
      - api
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
