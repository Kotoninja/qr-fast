<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QR Studio — конструктор QR-кодов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="icon" href="static/images/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#1c1b1a;
    --panel:#232220;
    --panel-2:#2b2a27;
    --ink:#edeae3;
    --ink-dim:#a7a39a;
    --amber:#f97316;
    --teal:#4fa69c;
    --line:#3a3834;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    background-image:
      radial-gradient(var(--line) 1px, transparent 1px);
    background-size: 22px 22px;
    background-position: -11px -11px;
  }
  header{
    padding:28px 32px 18px;
    display:flex;
    align-items:baseline;
    gap:14px;
    border-bottom:1px solid var(--line);
  }
  header h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:22px;
    font-weight:700;
    margin:0;
    letter-spacing:.2px;
  }
  header span{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--ink-dim);
    background:var(--panel);
    border:1px solid var(--line);
    padding:3px 8px;
    border-radius:999px;
  }
  main{
    display:grid;
    grid-template-columns:380px 1fr;
    gap:0;
    min-height:calc(100vh - 74px);
  }
  @media (max-width:860px){
    main{grid-template-columns:1fr;}
  }
  .panel{
    padding:28px;
    border-right:1px solid var(--line);
    background:var(--panel);
    overflow-y:auto;
  }
  .field{margin-bottom:20px;}
  .field label{
    display:block;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--ink-dim);
    margin-bottom:8px;
  }
  .field textarea,
  .field select,
  .field input[type="text"],
  .field input[type="number"]{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:8px;
    padding:10px 12px;
    font-family:'Inter',sans-serif;
    font-size:14px;
  }
  .field textarea{resize:vertical;min-height:56px;}
  .row{display:flex;gap:12px;}
  .row > *{flex:1;}
  .color-row{display:flex;align-items:center;gap:10px;}
  .color-row input[type="color"]{
    width:40px;height:40px;
    border:1px solid var(--line);
    border-radius:8px;
    background:none;
    padding:0;
    cursor:pointer;
  }
  .color-row code{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--ink-dim);
  }
  .toggle-line{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .toggle-line label{margin:0;}
  .segmented{
    display:flex;
    border:1px solid var(--line);
    border-radius:8px;
    overflow:hidden;
  }
  .segmented button{
    flex:1;
    background:var(--panel-2);
    border:none;
    color:var(--ink-dim);
    padding:8px 6px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    cursor:pointer;
    border-right:1px solid var(--line);
  }
  .segmented button:last-child{border-right:none;}
  .segmented button.active{
    background:var(--amber);
    color:#1c1b1a;
    font-weight:600;
  }
  input[type="range"]{width:100%;accent-color:var(--amber);}
  input[type="file"]{
    font-size:12px;
    color:var(--ink-dim);
  }
  .section-title{
    font-family:'Space Grotesk',sans-serif;
    font-size:13px;
    font-weight:600;
    color:var(--teal);
    margin:26px 0 14px;
    text-transform:uppercase;
    letter-spacing:.06em;
  }
  .section-title:first-of-type{margin-top:0;}

  .stage{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:22px;
    padding:40px;
  }
  .swatch{
    width:min(420px, 80vw);
    aspect-ratio:1/1;
    border-radius:24px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.55);
    position:relative;
    overflow:hidden;
    border:1px solid var(--line);
    background:
      linear-gradient(45deg, #2b2a27 25%, transparent 25%) -10px 0/20px 20px,
      linear-gradient(-45deg, #2b2a27 25%, transparent 25%) -10px 0/20px 20px,
      linear-gradient(45deg, transparent 75%, #2b2a27 75%) -10px 0/20px 20px,
      linear-gradient(-45deg, transparent 75%, #2b2a27 75%) -10px 0/20px 20px,
      var(--panel);
  }
  .swatch img{
    width:78%;
    height:78%;
    object-fit:contain;
    filter:drop-shadow(0 12px 24px rgba(0,0,0,.35));
  }
  .swatch .placeholder{
    font-family:'JetBrains Mono',monospace;
    color:var(--ink-dim);
    font-size:12px;
    text-align:center;
    padding:20px;
  }
  .actions{display:flex;gap:12px;}
  .btn{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:13px;
    padding:12px 20px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--ink);
    cursor:pointer;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    gap:8px;
  }
  .btn.primary{
    background:var(--amber);
    color:#1c1b1a;
    border-color:var(--amber);
  }
  .status{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--ink-dim);
    min-height:14px;
  }
</style>
</head>
<body>

<header style="display: flex; align-items: center;" >
  <img width="32px" height="32px" src="static/images/favicon.svg">
  <h1>QRcode Studio</h1>
  <span>кастомизация визуала QR-кодов</span>
</header>

<main>
  <div class="panel">

    <div class="section-title">Содержимое</div>
    <div class="field">
      <label>Данные (ссылка / текст)</label>
      <textarea id="data" placeholder="https://example.com">https://example.com</textarea>
    </div>

    <div class="section-title">Форма модулей</div>
    <div class="field">
      <div class="segmented" id="module_style">
        <button data-v="square">квадрат</button>
        <button data-v="rounded" class="active">скругл.</button>
        <button data-v="circle">круг</button>
        <button data-v="gapped">точки</button>
      </div>
    </div>

    <div class="section-title">Цвет</div>
    <div class="field color-row">
      <input type="color" id="fg_color" value="#1c1b1a">
      <div>
        <label style="margin:0">Основной цвет</label>
        <code id="fg_color_val">#1c1b1a</code>
      </div>
    </div>
    <div class="field toggle-line">
      <label style="margin:0">Градиент</label>
      <input type="checkbox" id="use_gradient">
    </div>
    <div class="field color-row" id="fg_color2_wrap" style="display:none">
      <input type="color" id="fg_color2" value="#e8a33d">
      <div>
        <label style="margin:0">Второй цвет</label>
        <code id="fg_color2_val">#e8a33d</code>
      </div>
    </div>
    <div class="field" id="gradient_dir_wrap" style="display:none">
      <label>Направление градиента</label>
      <select id="gradient">
        <option value="radial">радиальный</option>
        <option value="horizontal">горизонтальный</option>
        <option value="vertical">вертикальный</option>
        <option value="square">квадратный</option>
      </select>
    </div>

    <div class="field color-row">
      <input type="color" id="bg_color" value="#ffffff">
      <div>
        <label style="margin:0">Фон</label>
        <code id="bg_color_val">#ffffff</code>
      </div>
    </div>
    <div class="field toggle-line">
      <label style="margin:0">Прозрачный фон</label>
      <input type="checkbox" id="transparent_bg">
    </div>

    <div class="section-title">Логотип по центру</div>
    <div class="field">
      <label>Изображение (необязательно)</label>
      <input type="file" id="logo" accept="image/*">
    </div>
    <div class="field toggle-line">
      <label style="margin:0">Круглая подложка</label>
      <input type="checkbox" id="rounded_logo" checked>
    </div>
    <div class="field">
      <label>Размер логотипа: <span id="logo_size_val">22%</span></label>
      <input type="range" id="logo_size_ratio" min="10" max="35" value="22">
    </div>

    <div class="section-title">Технические параметры</div>
    <div class="row">
      <div class="field">
        <label>Размер модуля (px)</label>
        <input type="number" id="box_size" value="10" min="2" max="30">
      </div>
      <div class="field">
        <label>Отступ (модулей)</label>
        <input type="number" id="border" value="4" min="0" max="10">
      </div>
    </div>
    <div class="field">
      <label>Коррекция ошибок</label>
      <select id="error_correction">
        <option value="L">L — минимальная</option>
        <option value="M">M — базовая</option>
        <option value="Q">Q — повышенная</option>
        <option value="H" selected>H — максимальная (нужна для логотипа)</option>
      </select>
    </div>

  </div>

  <div class="stage">
    <div class="swatch" id="swatch">
      <div class="placeholder">Заполните форму слева —<br>превью появится здесь</div>
    </div>
    <div class="actions">
      <button class="btn primary" id="refreshBtn">Обновить превью</button>
      <a class="btn" id="downloadBtn" href="#" download="qr-code.png">Скачать PNG</a>
    </div>
    <div class="status" id="status"></div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);

// сегментированный переключатель формы модулей
let moduleStyle = 'rounded';
document.querySelectorAll('#module_style button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#module_style button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    moduleStyle = btn.dataset.v;
    render();
  });
});

$('fg_color').addEventListener('input', e => $('fg_color_val').textContent = e.target.value);
$('fg_color2').addEventListener('input', e => $('fg_color2_val').textContent = e.target.value);
$('bg_color').addEventListener('input', e => $('bg_color_val').textContent = e.target.value);
$('logo_size_ratio').addEventListener('input', e => $('logo_size_val').textContent = e.target.value + '%');

$('use_gradient').addEventListener('change', e => {
  const show = e.target.checked;
  $('fg_color2_wrap').style.display = show ? 'flex' : 'none';
  $('gradient_dir_wrap').style.display = show ? 'block' : 'none';
});

let lastImageDataUrl = null;
let debounceTimer = null;

function scheduleRender(){
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(render, 400);
}

// live-обновление при вводе (кроме кнопки, которая шлёт сразу)
['data','fg_color','fg_color2','bg_color','transparent_bg','rounded_logo',
 'logo_size_ratio','box_size','border','error_correction','gradient','use_gradient']
 .forEach(id => {
   const el = $(id);
   const evt = (el.tagName === 'SELECT' || el.type === 'checkbox') ? 'change' : 'input';
   el.addEventListener(evt, scheduleRender);
 });
$('logo').addEventListener('change', render);
$('refreshBtn').addEventListener('click', render);

async function render(){
  const status = $('status');
  status.textContent = 'генерируем…';

  const fd = new FormData();
  fd.append('data', $('data').value || ' ');
  fd.append('module_style', moduleStyle);
  fd.append('fg_color', $('fg_color').value);
  fd.append('fg_color2', $('use_gradient').checked ? $('fg_color2').value : '');
  fd.append('gradient', $('gradient').value);
  fd.append('bg_color', $('transparent_bg').checked ? 'transparent' : $('bg_color').value);
  fd.append('box_size', $('box_size').value);
  fd.append('border', $('border').value);
  fd.append('error_correction', $('error_correction').value);
  fd.append('logo_size_ratio', ($('logo_size_ratio').value / 100).toString());
  fd.append('rounded_logo', $('rounded_logo').checked);
  if ($('logo').files[0]) fd.append('logo', $('logo').files[0]);

  try{
    const res = await fetch('/generate-base64', { method:'POST', body: fd });
    if(!res.ok){
      const err = await res.json().catch(()=>({detail:'Ошибка генерации'}));
      throw new Error(err.detail || 'Ошибка генерации');
    }
    const json = await res.json();
    lastImageDataUrl = json.image;

    const swatch = $('swatch');
    swatch.innerHTML = '';
    const img = document.createElement('img');
    img.src = lastImageDataUrl;
    swatch.appendChild(img);
    swatch.style.background = $('transparent_bg').checked ? '' : $('bg_color').value;
    if ($('transparent_bg').checked) {
      // возвращаем шахматный фон-подложку для наглядности прозрачности
      swatch.style.background =
        'linear-gradient(45deg, #2b2a27 25%, transparent 25%) -10px 0/20px 20px,' +
        'linear-gradient(-45deg, #2b2a27 25%, transparent 25%) -10px 0/20px 20px,' +
        'linear-gradient(45deg, transparent 75%, #2b2a27 75%) -10px 0/20px 20px,' +
        'linear-gradient(-45deg, transparent 75%, #2b2a27 75%) -10px 0/20px 20px,' +
        'var(--panel)';
    }

    $('downloadBtn').href = lastImageDataUrl;
    status.textContent = 'готово';
  }catch(e){
    status.textContent = 'ошибка: ' + e.message;
  }
}

render();
</script>

</body>
</html>
